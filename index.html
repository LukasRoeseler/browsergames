    <meta charset="UTF-8">

    <title>My Games Collection</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #3b82f6;
            --text-color: #efefef;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* The Grid Container */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 per row on mobile */
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        /* Responsive: 3 or 4 per row on larger screens */
        @media (min-width: 600px) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        /* The Tile Style */
        .game-card {
            background: var(--card-bg);
            aspect-ratio: 1 / 1; /* Keep it square */
            border-radius: 16px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            background: #252525;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: var(--accent-color);
        }

        .game-card svg {
            width: 50%;
            height: 50%;
            margin-bottom: 12px;
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .game-card span {
            font-size: 14px;
            font-weight: 500;
        }

        .sub-label {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
        }
    </style>
</head>

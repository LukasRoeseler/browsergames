<!--
  ============================================================
  PDF Tool  —  Version: 0.1.2
  ============================================================

  VERSIONING RULES (how to bump):
  - Format: MAJOR.MINOR.PATCH   (currently 0.1.2)
  - EVERY COMMIT: bump the PATCH (final) number by 1. e.g. 0.1.1 -> 0.1.2
  - BIGGER CHANGES (new feature, UI overhaul, behaviour change):
      bump the MINOR (second) number by 1 and reset PATCH to 0.
      e.g. 0.1.2 -> 0.2.0   — and say so in the commit message.
  - MAJOR (first) number: only for large breaking rewrites. 0.2.0 -> 1.0.0

  WHERE TO UPDATE THE VERSION:
  The single source of truth is the `VERSION` constant in the
  <script> block below (search for: const VERSION). Update it there,
  and keep this header comment in sync. The footer shows it automatically.

  NOTE: Increment the version on the SAME commit that makes the change.
  ============================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Tool</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233b82f6'/%3E%3Ctext x='12' y='16.5' font-family='Arial,sans-serif' font-size='8.5' font-weight='bold' fill='white' text-anchor='middle'%3EPDF%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #3b82f6;
            --text-color: #efefef;
            --muted: #888;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 { font-weight: 300; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .subtitle { color: var(--muted); margin-bottom: 20px; text-align: center; }

        .drop-zone {
            width: 100%; max-width: 860px;
            border: 2px dashed #444; border-radius: 16px;
            padding: 40px 20px; text-align: center; cursor: pointer;
            transition: all 0.2s; background: var(--card-bg); margin-bottom: 20px;
        }
        .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent-color); background: #1f1f1f; }
        .drop-zone .icon { font-size: 40px; margin-bottom: 10px; }
        .drop-zone p { margin: 5px 0; color: var(--muted); }
        .drop-zone strong { color: var(--text-color); }

        .hidden { display: none; }
        #status { color: var(--muted); margin-bottom: 10px; min-height: 20px; text-align: center; }

        .action-bar {
            position: sticky; top: 0; z-index: 50;
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
            width: 100%; max-width: 860px; margin-bottom: 14px;
            background: rgba(15,15,15,0.96); padding: 10px 12px;
            border: 1px solid #2a2a2a; border-radius: 12px;
            backdrop-filter: blur(4px);
        }
        .action-bar .sep {
            width: 1px; height: 24px; background: #333; margin: 0 2px;
        }
        .options-panel {
            display: flex; flex-direction: column; gap: 10px; align-items: center;
            width: 100%; max-width: 860px; margin-bottom: 14px;
            background: var(--card-bg); padding: 12px;
            border: 1px solid #2a2a2a; border-radius: 12px;
        }
        .options-panel.hidden { display: none; }
        .tgroup {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
        }

        .size-row, .field-row {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
        }
        .size-row label, .field-row label { color: var(--muted); font-size: 14px; }
        .size-row select, .size-row input[type="number"], .field-row input[type="text"] {
            background: var(--card-bg); color: var(--text-color);
            border: 1px solid #333; border-radius: 8px; padding: 7px 10px; font-size: 14px;
        }
        .size-row select:focus, .size-row input:focus, .field-row input:focus { outline: none; border-color: var(--accent-color); }
        .size-row input[type="number"] { width: 70px; }
        .field-row input[type="text"] { width: 150px; }

        .check-row {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
        }
        .check-row label { color: var(--muted); font-size: 14px; }
        .check-row input { accent-color: var(--accent-color); }
        .check-row input[type="range"] { accent-color: var(--accent-color); }

        .btn {
            background: var(--card-bg); color: var(--text-color);
            border: 1px solid #333; border-radius: 10px; padding: 9px 16px;
            font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { background: #252525; border-color: var(--accent-color); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.primary { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
        .btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
        .btn.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

        #pages {
            width: 100%; max-width: 860px;
            display: flex; flex-direction: column; gap: 18px;
            --tw: 140px; --th: 190px;
        }

        .doc-section { background: #141414; border: 1px solid #2a2a2a; border-radius: 14px; padding: 12px; }
        .doc-header {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding-bottom: 10px; border-bottom: 1px solid #2a2a2a; margin-bottom: 10px;
        }
        .doc-name { font-weight: 600; font-size: 15px; }
        .doc-count { color: var(--muted); font-size: 13px; }
        .doc-pages { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

        .page-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 12px;
            padding: 10px; width: 170px; display: flex; flex-direction: column;
            align-items: center; gap: 6px; position: relative;
            transition: transform 0.15s, border-color 0.15s;
        }
        .page-card.dragging { opacity: 0.5; }
        .page-card.drop-target { border-color: var(--accent-color); box-shadow: 0 0 0 2px var(--accent-color); }

        .thumb-wrap {
            width: var(--tw); height: var(--th); display: flex; align-items: center; justify-content: center;
            background: #111; border-radius: 6px; overflow: hidden;
        }
        .thumb-wrap canvas, .placeholder { max-width: 100%; max-height: 100%; transition: transform 0.2s; }
        .placeholder {
            display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
            color: var(--muted); font-size: 12px; background: #161616; border: 1px dashed #333; border-radius: 6px;
        }

        .page-meta { font-size: 12px; color: var(--muted); text-align: center; }
        .page-meta b { color: var(--text-color); }

        .controls { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
        .ctrl {
            background: #222; color: var(--text-color); border: 1px solid #333;
            border-radius: 6px; width: 30px; height: 30px; font-size: 15px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .ctrl:hover { border-color: var(--accent-color); background: #2a2a2a; }
        .ctrl.del:hover { border-color: var(--danger); color: var(--danger); }

        .select-row { display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center; }
        .select-row input { accent-color: var(--accent-color); }

        .footer { margin-top: auto; padding: 20px; color: var(--muted); font-size: 12px; }
    </style>
</head>
<body>

    <h1>PDF Tool</h1>
    <div class="subtitle">Merge, split, reorder, rotate and remove pages &mdash; everything stays on your device</div>

    <div class="drop-zone" id="dropZone">
        <div class="icon">&#128196;</div>
        <p><strong>Click to choose</strong> or drag &amp; drop one or more PDFs here</p>
        <p>Your files are processed locally and never uploaded.</p>
        <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple class="hidden">
    </div>

    <div id="status"></div>

    <div class="action-bar" id="actionBar" style="display:none;">
        <button class="btn primary" id="mergeBtn">Merge &amp; Download</button>
        <button class="btn" id="exportSelBtn">Export Selected</button>
        <button class="btn" id="splitSrcBtn">Split by Source</button>
        <button class="btn" id="zipBtn">Download ZIP</button>
        <span class="sep"></span>
        <button class="btn" id="undoBtn" disabled>Undo</button>
        <button class="btn" id="redoBtn" disabled>Redo</button>
        <span class="sep"></span>
        <button class="btn danger" id="clearBtn">Clear All</button>
        <button class="btn" id="optionsBtn">Options &#9662;</button>
    </div>

    <div class="options-panel hidden" id="optionsPanel">
        <div class="tgroup">
            <button class="btn" id="selectAllBtn">Select All</button>
            <button class="btn" id="selectNoneBtn">Select None</button>
            <button class="btn" id="groupBtn">Group by Source</button>
            <button class="btn" id="splitBtn">Split Selected Pages</button>
        </div>
        <div class="tgroup size-row">
            <label for="sizeSelect">Page size:</label>
            <select id="sizeSelect">
                <option value="original">Original</option>
                <option value="a4">A4 (210&times;297mm)</option>
                <option value="letter">Letter</option>
                <option value="a3">A3</option>
                <option value="legal">Legal</option>
                <option value="custom">Custom</option>
            </select>
            <input type="number" id="sizeW" class="hidden" placeholder="W (pt)" min="1">
            <input type="number" id="sizeH" class="hidden" placeholder="H (pt)" min="1">
            <button class="btn" id="fitLargestBtn">Fit to Largest</button>
            <button class="btn" id="fitSmallestBtn">Fit to Smallest</button>
            <label><input type="checkbox" id="landscapeChk"> Force landscape</label>
        </div>
        <div class="tgroup field-row">
            <label for="fileName">File name:</label>
            <input type="text" id="fileName" placeholder="output">
            <label for="titleInput">Title:</label>
            <input type="text" id="titleInput" placeholder="(optional)">
            <label for="authorInput">Author:</label>
            <input type="text" id="authorInput" placeholder="(optional)">
        </div>
        <div class="tgroup check-row">
            <label>Zoom <input type="range" id="zoom" min="50" max="200" value="100"></label>
            <label><input type="checkbox" id="previewAll" checked> Preview all pages</label>
        </div>
    </div>

    <div id="pages"></div>

    <div class="footer">Made with PDF-Lib, PDF.js &amp; JSZip &middot; <span id="version">v0.1.2</span></div>

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const VERSION = '0.1.2'; // bump PATCH on every commit; bump MINOR for bigger changes (see header comment)
        document.getElementById('version').textContent = 'v' + VERSION;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusEl = document.getElementById('status');
        const actionBar = document.getElementById('actionBar');
        const optionsPanel = document.getElementById('optionsPanel');
        const pagesEl = document.getElementById('pages');

        const sources = [];   // { id, name, pdfDoc, jsDoc }
        const pageList = [];  // { id, kind, sourceId, pageIndex, rotation, w, h, canvas, thumbEl }
        const history = [];
        const redoStack = [];
        let nextSourceId = 0;
        let nextPageId = 0;

        function showToolbar() { actionBar.style.display = 'flex'; }
        function hideToolbar() { actionBar.style.display = 'none'; optionsPanel.classList.add('hidden'); }
        let previewAll = true;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) addFiles(e.target.files);
        });

        ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, (e) => {
            e.preventDefault(); dropZone.classList.add('dragover');
        }));
        ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
        }));
        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
        });

        async function addFiles(fileList) {
            setStatus('Loading PDFs...');
            for (const file of fileList) {
                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    setStatus(`Skipping "${file.name}": not a PDF.`, true);
                    continue;
                }
                try {
                    const bytes = await file.arrayBuffer();
                    const pdfDoc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
                    const jsDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
                    const srcId = nextSourceId++;
                    sources.push({ id: srcId, name: file.name, pdfDoc, jsDoc });
                    const count = pdfDoc.getPageCount();
                    for (let i = 0; i < count; i++) {
                        pageList.push({
                            id: nextPageId++, kind: 'source', sourceId: srcId,
                            pageIndex: i, rotation: 0, w: null, h: null,
                            canvas: null, thumbEl: null
                        });
                    }
                    setStatus(`Loaded "${file.name}" (${count} page${count > 1 ? 's' : ''}).`);
                } catch (err) {
                    console.error(err);
                    setStatus(`Could not read "${file.name}".`, true);
                }
            }
            showToolbar();
            renderAll();
            updateCount();
        }

        function renderAll() {
            pagesEl.innerHTML = '';
            let lastSid = null;
            let currentSection = null;
            for (const p of pageList) {
                if (p.sourceId !== lastSid) {
                    lastSid = p.sourceId;
                    currentSection = createSection(p.sourceId);
                    pagesEl.appendChild(currentSection);
                }
                currentSection.querySelector('.doc-pages').appendChild(createCard(p));
            }
        }

        function createSection(srcId) {
            const sec = document.createElement('div');
            sec.className = 'doc-section';
            sec.dataset.sourceId = srcId;

            const src = sources.find(s => s.id === srcId);
            const name = src ? src.name : 'Inserted pages';
            const count = pageList.filter(p => p.sourceId === srcId).length;

            const header = document.createElement('div');
            header.className = 'doc-header';
            const nm = document.createElement('span');
            nm.className = 'doc-name';
            nm.textContent = name;
            const cnt = document.createElement('span');
            cnt.className = 'doc-count';
            cnt.textContent = `${count} page${count !== 1 ? 's' : ''}`;
            header.appendChild(nm);
            header.appendChild(cnt);
            header.appendChild(makeBtn('\u2191', 'Move document up', () => moveDoc(srcId, -1)));
            header.appendChild(makeBtn('\u2193', 'Move document down', () => moveDoc(srcId, 1)));
            header.appendChild(makeBtn('\u2611', 'Select all in document', () => setDocCheckboxes(srcId, true)));
            header.appendChild(makeBtn('\u2715', 'Remove document', () => removeDoc(srcId), true));

            const row = document.createElement('div');
            row.className = 'doc-pages';

            sec.appendChild(header);
            sec.appendChild(row);
            return sec;
        }

        function makeBtn(text, title, handler, isDel) {
            const b = document.createElement('button');
            b.className = 'btn' + (isDel ? ' danger' : '');
            b.textContent = text;
            b.title = title;
            b.addEventListener('click', handler);
            return b;
        }

        function shouldRenderThumb(p) {
            return previewAll || p.pageIndex === 0;
        }

        function createCard(p) {
            const card = document.createElement('div');
            card.className = 'page-card';
            card.draggable = true;
            card.dataset.id = p.id;
            card.dataset.sourceId = p.sourceId;

            const src = p.kind === 'source' ? sources.find(s => s.id === p.sourceId) : null;

            const selectRow = document.createElement('div');
            selectRow.className = 'select-row';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.title = 'Select page';
            selectRow.appendChild(cb);
            card.appendChild(selectRow);

            const thumbWrap = document.createElement('div');
            thumbWrap.className = 'thumb-wrap';

            if (p.kind === 'blank') {
                p.thumbEl = makePlaceholder('Blank');
                thumbWrap.appendChild(p.thumbEl);
            } else if (p.canvas) {
                thumbWrap.appendChild(p.canvas);
                p.thumbEl = p.canvas;
            } else if (shouldRenderThumb(p)) {
                const canvas = document.createElement('canvas');
                thumbWrap.appendChild(canvas);
                p.canvas = canvas;
                p.thumbEl = canvas;
                renderThumb(p, canvas);
            } else {
                p.thumbEl = makePlaceholder(`Page ${p.pageIndex + 1}`);
                thumbWrap.appendChild(p.thumbEl);
            }
            applyRotation(p);
            card.appendChild(thumbWrap);

            const meta = document.createElement('div');
            meta.className = 'page-meta';
            if (p.kind === 'blank') {
                meta.innerHTML = 'Blank page';
            } else {
                meta.innerHTML = `Page <b>${p.pageIndex + 1}</b><br>${src ? escapeHtml(src.name) : ''}`;
            }
            card.appendChild(meta);

            const controls = document.createElement('div');
            controls.className = 'controls';

            controls.appendChild(makeCtrl('\u27F2', 'Rotate 90\u00B0 CW', () => { pushHistory(); p.rotation = (p.rotation + 90) % 360; applyRotation(p); }));
            controls.appendChild(makeCtrl('\u27F3', 'Rotate 90\u00B0 CCW', () => { pushHistory(); p.rotation = (p.rotation - 90 + 360) % 360; applyRotation(p); }));
            controls.appendChild(makeCtrl('\u29C9', 'Duplicate page', () => duplicatePage(p.id)));
            controls.appendChild(makeCtrl('\u25A3', 'Insert blank page', () => insertBlankAfter(p.id)));
            controls.appendChild(makeCtrl('\u2191', 'Move up', () => movePage(p.id, -1)));
            controls.appendChild(makeCtrl('\u2193', 'Move down', () => movePage(p.id, 1)));
            controls.appendChild(makeCtrl('\u2715', 'Remove page', () => removePage(p.id), true));

            card.appendChild(controls);

            card.addEventListener('dragstart', (e) => {
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', String(p.id));
            });
            card.addEventListener('dragend', () => card.classList.remove('dragging'));
            card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drop-target'); });
            card.addEventListener('dragleave', () => card.classList.remove('drop-target'));
            card.addEventListener('drop', (e) => {
                e.preventDefault();
                card.classList.remove('drop-target');
                const dragId = Number(e.dataTransfer.getData('text/plain'));
                reorderPage(dragId, p.id);
            });

            return card;
        }

        function makePlaceholder(text) {
            const ph = document.createElement('div');
            ph.className = 'placeholder';
            ph.textContent = text;
            return ph;
        }

        function makeCtrl(text, title, handler, isDel) {
            const b = document.createElement('button');
            b.className = 'ctrl' + (isDel ? ' del' : '');
            b.textContent = text;
            b.title = title;
            b.addEventListener('click', handler);
            return b;
        }

        async function renderThumb(p, canvas) {
            const src = sources.find(s => s.id === p.sourceId);
            if (!src) return;
            try {
                const page = await src.jsDoc.getPage(p.pageIndex + 1);
                const base = page.getViewport({ scale: 1 });
                const scale = Math.min(140 / base.width, 190 / base.height);
                const viewport = page.getViewport({ scale });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            } catch (err) {
                console.error(err);
            }
        }

        function applyRotation(p) {
            if (p.thumbEl) p.thumbEl.style.transform = `rotate(${p.rotation}deg)`;
        }

        // ---------- history / undo-redo ----------
        function snapshot() {
            return pageList.map(p => ({ id: p.id, kind: p.kind, sourceId: p.sourceId, pageIndex: p.pageIndex, rotation: p.rotation, w: p.w, h: p.h }));
        }
        function pushHistory() {
            history.push(snapshot());
            if (history.length > 100) history.shift();
            redoStack.length = 0;
            updateUndoRedo();
        }
        function restore(state) {
            pageList.length = 0;
            for (const s of state) pageList.push({ ...s, canvas: null, thumbEl: null });
            renderAll();
            updateCount();
        }
        function undo() {
            if (!history.length) return;
            redoStack.push(snapshot());
            restore(history.pop());
            updateUndoRedo();
        }
        function redo() {
            if (!redoStack.length) return;
            history.push(snapshot());
            restore(redoStack.pop());
            updateUndoRedo();
        }
        function updateUndoRedo() {
            document.getElementById('undoBtn').disabled = !history.length;
            document.getElementById('redoBtn').disabled = !redoStack.length;
        }

        // ---------- page mutations ----------
        function movePage(id, dir) {
            const idx = pageList.findIndex(p => p.id === id);
            const to = idx + dir;
            if (idx < 0 || to < 0 || to >= pageList.length) return;
            pushHistory();
            const [moved] = pageList.splice(idx, 1);
            pageList.splice(to, 0, moved);
            renderAll();
        }

        function reorderPage(dragId, dropId) {
            const from = pageList.findIndex(p => p.id === dragId);
            const to = pageList.findIndex(p => p.id === dropId);
            if (from < 0 || to < 0 || from === to) return;
            pushHistory();
            const [moved] = pageList.splice(from, 1);
            pageList.splice(to, 0, moved);
            renderAll();
        }

        function removePage(id) {
            const idx = pageList.findIndex(p => p.id === id);
            if (idx < 0) return;
            pushHistory();
            pageList.splice(idx, 1);
            if (pageList.length === 0) hideToolbar();
            renderAll();
            updateCount();
        }

        function duplicatePage(id) {
            const idx = pageList.findIndex(p => p.id === id);
            if (idx < 0) return;
            pushHistory();
            const o = pageList[idx];
            pageList.splice(idx + 1, 0, {
                id: nextPageId++, kind: o.kind, sourceId: o.sourceId,
                pageIndex: o.pageIndex, rotation: o.rotation, w: o.w, h: o.h,
                canvas: null, thumbEl: null
            });
            renderAll();
            updateCount();
        }

        function insertBlankAfter(id) {
            const idx = pageList.findIndex(p => p.id === id);
            if (idx < 0) return;
            pushHistory();
            const size = globalSize || { w: 595, h: 842 };
            pageList.splice(idx + 1, 0, {
                id: nextPageId++, kind: 'blank', sourceId: -1, pageIndex: -1,
                rotation: 0, w: size.w, h: size.h, canvas: null, thumbEl: null
            });
            renderAll();
            updateCount();
        }

        function moveDoc(srcId, dir) {
            const order = [];
            for (const p of pageList) if (!order.includes(p.sourceId)) order.push(p.sourceId);
            const idx = order.indexOf(srcId);
            const swapIdx = idx + dir;
            if (idx < 0 || swapIdx < 0 || swapIdx >= order.length) return;
            pushHistory();
            [order[idx], order[swapIdx]] = [order[swapIdx], order[idx]];
            const newList = [];
            for (const sid of order) newList.push(...pageList.filter(p => p.sourceId === sid));
            pageList.length = 0;
            pageList.push(...newList);
            renderAll();
        }

        function removeDoc(srcId) {
            pushHistory();
            const keep = pageList.filter(p => p.sourceId !== srcId);
            pageList.length = 0;
            pageList.push(...keep);
            const si = sources.findIndex(s => s.id === srcId);
            if (si >= 0) sources.splice(si, 1);
            if (pageList.length === 0) hideToolbar();
            renderAll();
            updateCount();
        }

        function updateCount() {
            setStatus(`${pageList.length} page${pageList.length !== 1 ? 's' : ''} in document.`);
        }

        function selectedPages() {
            return pageList.filter(p => {
                const cb = document.querySelector(`.page-card[data-id="${p.id}"] .select-row input`);
                return cb && cb.checked;
            });
        }

        function setDocCheckboxes(srcId, checked) {
            document.querySelectorAll(`.page-card[data-source-id="${srcId}"] .select-row input`).forEach(cb => cb.checked = checked);
        }

        // ---------- page size ----------
        const sizePresets = { a4: { w: 595, h: 842 }, letter: { w: 612, h: 792 }, a3: { w: 842, h: 1191 }, legal: { w: 612, h: 1008 } };
        let globalSize = null;

        const sizeSelect = document.getElementById('sizeSelect');
        const sizeW = document.getElementById('sizeW');
        const sizeH = document.getElementById('sizeH');
        const landscapeChk = document.getElementById('landscapeChk');

        function updateGlobalSize() {
            const v = sizeSelect.value;
            if (v === 'original') {
                globalSize = null;
                sizeW.classList.add('hidden'); sizeH.classList.add('hidden');
            } else if (v === 'custom') {
                sizeW.classList.remove('hidden'); sizeH.classList.remove('hidden');
                const w = Number(sizeW.value), h = Number(sizeH.value);
                globalSize = (w > 0 && h > 0) ? { w, h } : null;
            } else {
                sizeW.classList.add('hidden'); sizeH.classList.add('hidden');
                globalSize = sizePresets[v] || null;
            }
        }
        sizeSelect.addEventListener('change', updateGlobalSize);
        sizeW.addEventListener('input', updateGlobalSize);
        sizeH.addEventListener('input', updateGlobalSize);

        function effectivePageSize(p) {
            if (p.kind === 'blank') {
                const rotated = (p.rotation === 90 || p.rotation === 270);
                return { w: rotated ? p.h : p.w, h: rotated ? p.w : p.h };
            }
            const src = sources.find(s => s.id === p.sourceId);
            if (!src) return null;
            const srcPage = src.pdfDoc.getPages()[p.pageIndex];
            const box = srcPage.getSize();
            const effRot = (srcPage.getRotation().angle + p.rotation) % 360;
            const rotated = (effRot === 90 || effRot === 270);
            return { w: rotated ? box.height : box.width, h: rotated ? box.width : box.height };
        }

        function fitToExtreme(mode) {
            let target = null;
            for (const p of pageList) {
                const s = effectivePageSize(p);
                if (!s) continue;
                const area = s.w * s.h;
                if (!target || (mode === 'max' ? area > target.area : area < target.area)) target = { s, area };
            }
            if (!target) return;
            globalSize = { w: Math.round(target.s.w), h: Math.round(target.s.h) };
            sizeSelect.value = 'custom';
            sizeW.value = globalSize.w;
            sizeH.value = globalSize.h;
            sizeW.classList.remove('hidden'); sizeH.classList.remove('hidden');
            setStatus(`Page size set to ${globalSize.w} x ${globalSize.h} pt (${mode === 'max' ? 'largest' : 'smallest'} page).`);
        }

        function targetBox(p) {
            if (p.kind === 'blank') { let w = p.w, h = p.h; if (landscapeChk.checked && w < h) { const t = w; w = h; h = t; } return { w, h }; }
            const src = sources.find(s => s.id === p.sourceId);
            if (!src) return null;
            const srcPage = src.pdfDoc.getPages()[p.pageIndex];
            const box = srcPage.getSize();
            let w = globalSize ? globalSize.w : box.width;
            let h = globalSize ? globalSize.h : box.height;
            if (landscapeChk.checked && w < h) { const t = w; w = h; h = t; }
            return { w, h };
        }

        // ---------- output ----------
        async function buildOutputDoc(pages) {
            const out = await PDFLib.PDFDocument.create();
            const title = document.getElementById('titleInput').value.trim();
            const author = document.getElementById('authorInput').value.trim();
            if (title) out.setTitle(title);
            if (author) out.setAuthor(author);

            for (const p of pages) {
                if (p.kind === 'blank') {
                    const box = targetBox(p);
                    const effRot = p.rotation;
                    const swap = (effRot === 90 || effRot === 270);
                    const pg = out.addPage([swap ? box.h : box.w, swap ? box.w : box.h]);
                    if (effRot) pg.setRotation(PDFLib.degrees(effRot));
                    continue;
                }
                const src = sources.find(s => s.id === p.sourceId);
                if (!src) continue;
                const [copied] = await out.copyPages(src.pdfDoc, [p.pageIndex]);
                const srcPage = src.pdfDoc.getPages()[p.pageIndex];
                const orig = srcPage.getRotation().angle;
                const effRot = (orig + p.rotation) % 360;
                const box = targetBox(p);
                const swap = (effRot === 90 || effRot === 270);
                copied.setMediaBox(0, 0, swap ? box.h : box.w, swap ? box.w : box.h);
                copied.setRotation(PDFLib.degrees(effRot));
                out.addPage(copied);
            }
            return out;
        }

        function downloadPdf(doc, filename) {
            doc.save().then(bytes => {
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            });
        }

        function getBaseName() {
            const v = document.getElementById('fileName').value.trim();
            return v ? v.replace(/\.pdf$/i, '') : '';
        }

        function groupPagesBySource() {
            const order = [];
            for (const p of pageList) if (!order.includes(p.sourceId)) order.push(p.sourceId);
            return order.map(sid => ({
                name: sid === -1 ? 'inserted' : (sources.find(s => s.id === sid) ? sources.find(s => s.id === sid).name.replace(/\.pdf$/i, '') : 'doc'),
                pages: pageList.filter(p => p.sourceId === sid)
            }));
        }

        document.getElementById('mergeBtn').addEventListener('click', async () => {
            if (!pageList.length) return;
            setStatus('Merging...');
            const doc = await buildOutputDoc(pageList);
            downloadPdf(doc, (getBaseName() || 'merged') + '.pdf');
            setStatus('Merged PDF saved.');
        });

        document.getElementById('exportSelBtn').addEventListener('click', async () => {
            const sel = selectedPages();
            if (!sel.length) { setStatus('Select at least one page.', true); return; }
            setStatus('Exporting selected pages...');
            const doc = await buildOutputDoc(sel);
            downloadPdf(doc, (getBaseName() || 'selected-pages') + '.pdf');
            setStatus('Selected pages saved.');
        });

        document.getElementById('splitBtn').addEventListener('click', async () => {
            const sel = selectedPages();
            if (!sel.length) { setStatus('Select at least one page.', true); return; }
            setStatus('Splitting into separate PDFs...');
            const base = getBaseName() || 'page';
            for (let i = 0; i < sel.length; i++) {
                const doc = await buildOutputDoc([sel[i]]);
                downloadPdf(doc, `${base}-${sel[i].pageIndex + 1}.pdf`);
                await new Promise(r => setTimeout(r, 300));
            }
            setStatus('Split PDFs saved.');
        });

        document.getElementById('splitSrcBtn').addEventListener('click', async () => {
            const groups = groupPagesBySource();
            if (!groups.length) { setStatus('No pages.', true); return; }
            setStatus('Splitting by source...');
            const base = getBaseName();
            for (const g of groups) {
                const doc = await buildOutputDoc(g.pages);
                downloadPdf(doc, `${base ? base + '-' : ''}${g.name}.pdf`);
                await new Promise(r => setTimeout(r, 300));
            }
            setStatus('Split by source saved.');
        });

        document.getElementById('zipBtn').addEventListener('click', async () => {
            const groups = groupPagesBySource();
            if (!groups.length) { setStatus('No pages.', true); return; }
            setStatus('Creating ZIP...');
            try {
                const zip = new JSZip();
                const base = getBaseName();
                for (const g of groups) {
                    const doc = await buildOutputDoc(g.pages);
                    const bytes = await doc.save();
                    zip.file(`${base ? base + '-' : ''}${g.name}.pdf`, bytes);
                }
                const blob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = (base || 'pdf-tool') + '.zip';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                setStatus('ZIP saved.');
            } catch (err) {
                console.error(err);
                setStatus('Failed to create ZIP.', true);
            }
        });

        document.getElementById('groupBtn').addEventListener('click', () => {
            pushHistory();
            pageList.sort((a, b) => a.sourceId - b.sourceId || a.pageIndex - b.pageIndex);
            renderAll();
            setStatus('Pages grouped by source document.');
        });

        document.getElementById('fitLargestBtn').addEventListener('click', () => fitToExtreme('max'));
        document.getElementById('fitSmallestBtn').addEventListener('click', () => fitToExtreme('min'));

        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('redoBtn').addEventListener('click', redo);

        document.getElementById('clearBtn').addEventListener('click', () => {
            pushHistory();
            sources.length = 0;
            pageList.length = 0;
            hideToolbar();
            renderAll();
            setStatus('');
        });

        function setAllCheckboxes(checked) {
            pagesEl.querySelectorAll('.page-card .select-row input').forEach(cb => cb.checked = checked);
            const count = checked ? pageList.length : 0;
            setStatus(`${count} page${count !== 1 ? 's' : ''} selected.`);
        }
        document.getElementById('selectAllBtn').addEventListener('click', () => setAllCheckboxes(true));
        document.getElementById('selectNoneBtn').addEventListener('click', () => setAllCheckboxes(false));

        document.getElementById('previewAll').addEventListener('change', (e) => {
            previewAll = e.target.checked;
            for (const p of pageList) { p.canvas = null; p.thumbEl = null; }
            renderAll();
        });
        document.getElementById('zoom').addEventListener('input', (e) => {
            const scale = Number(e.target.value) / 100;
            pagesEl.style.setProperty('--tw', (140 * scale) + 'px');
            pagesEl.style.setProperty('--th', (190 * scale) + 'px');
        });

        document.getElementById('optionsBtn').addEventListener('click', (e) => {
            optionsPanel.classList.toggle('hidden');
            e.currentTarget.innerHTML = optionsPanel.classList.contains('hidden') ? 'Options &#9662;' : 'Options &#9652;';
        });

        function setStatus(msg, isError) {
            statusEl.textContent = msg;
            statusEl.style.color = isError ? 'var(--danger)' : 'var(--muted)';
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
    </script>
</body>
</html>
